name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Qt estable (daemon, QML e iconos)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detectar nuevas versiones estables
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check-updates.py
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ shellcheck python3-venv libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - name: Versión estable compartida por SDK y pruebas
        id: qt
        run: |
          version=$(sed -n 's/^PySide6-Essentials==\([0-9.]*\)$/\1/p' tests/requirements-ci.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: SDK Qt estable
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: ${{ steps.qt.outputs.version }}
          archives: icu qtbase qtdeclarative qtsvg qttools
          cache: true
      - name: Configurar y compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNOVA_WERROR=ON
          cmake --build build --parallel
      - name: Contratos y regresiones de IPC
        run: ctest --test-dir build --output-on-failure
      - name: Reglas, sintaxis QML y shellcheck
        run: |
          python3 -I tools/check-sources.py --qmlformat "$QT_ROOT_DIR/bin/qmlformat"
          shellcheck -x tools/novactl
      - name: Exportación reproducible
        run: |
          node --test tests/appearance.test.mjs
          node tools/export-icons.mjs build/icon-check
          diff -r assets/icons build/icon-check
      - name: Qt Quick y SVG sin módulos innecesarios
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-tests"
          "$RUNNER_TEMP/qt-tests/bin/python" -m pip install --disable-pip-version-check -r tests/requirements-ci.txt
      - name: Apariencia e iconos con Qt estable
        run: |
          "$RUNNER_TEMP/qt-tests/bin/python" tests/appearance_smoke.py
          "$RUNNER_TEMP/qt-tests/bin/python" tests/icon_library_test.py --qt
      - name: Capturas del renderizado
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: appearance-qt-stable
          path: build/appearance-*.png
          if-no-files-found: warn
