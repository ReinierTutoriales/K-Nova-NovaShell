[General]
# auto (sigue el esquema de color del sistema), light o dark.
appearance=auto
# Vacío: acento Liquid Glass (vidrio claro en claro, negro translúcido en
# oscuro). Un color #rrggbb lo sustituye por ese acento.
accent=
# Ruta absoluta a una imagen; vacío usa el fondo NovaShell claro/oscuro.
background=
# true desactiva la animación de entrada, la sacudida y el indicador giratorio.
reduceMotion=false
